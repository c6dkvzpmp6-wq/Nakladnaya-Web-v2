<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Накладная</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}
h1{font-size:24px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f7f8;border-radius:14px;padding:12px}.stat b{display:block;font-size:19px;margin-top:4px}.muted{color:#777;font-size:13px}
label{display:block;font-size:13px;color:#666;margin-bottom:5px}input{width:100%;border:1px solid #ddd;border-radius:11px;padding:11px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}.primary{background:#111;color:#fff}.voice{background:#7c3aed;color:white;font-size:17px;padding:14px 18px}.ghost{background:#eee}.danger{background:#fee;color:#b00}
.row{display:grid;grid-template-columns:2fr .7fr .9fr .9fr .9fr auto;gap:8px;align-items:end;margin:10px 0}.supplier{display:flex;gap:10px;align-items:center}.supplier h2{margin:0;font-size:18px}.supplierTotal{margin-left:auto;font-weight:700}.items{margin-top:12px}.item{border-top:1px solid #eee;padding:12px 0}.itemGrid{display:grid;grid-template-columns:72px 1.8fr .7fr .9fr .9fr .9fr;gap:8px;align-items:center}.photo{width:72px;height:72px;border-radius:12px;background:#eee;object-fit:cover}.sum{font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.voiceBox{display:flex;gap:10px;align-items:center}.status{min-height:20px;color:#666;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.itemGrid{grid-template-columns:58px 1fr 1fr}.itemGrid>*:nth-child(n+4){grid-column:auto}.photo{width:58px;height:58px}.supplierTotal{margin-left:0}.supplier{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Новая накладная</h1>
<div class="grid">
<div class="stat"><span class="muted">Денег на закупку</span><b id="budgetView">0 ₽</b></div>
<div class="stat"><span class="muted">Потрачено</span><b id="spentView">0 ₽</b></div>
<div class="stat"><span class="muted">Осталось</span><b id="leftView">0 ₽</b></div>
</div>
<div style="margin-top:12px"><label>Бюджет</label><input id="budget" inputmode="decimal" placeholder="100000"></div>
</div>

<div class="card">
<div class="supplier"><div><label>Поставщик</label><input id="supplierName" placeholder="Введите любое название поставщика"></div></div>
<div class="actions"><button class="primary" onclick="addSupplier()">+ Добавить поставщика</button></div>
</div>

<div id="suppliers"></div>

<div class="card">
<div class="voiceBox"><button class="voice" id="voiceBtn" onclick="startVoice()">🎙️ Диктовать товар</button><span id="voiceStatus" class="status">Скажите: «Джемпер 298 007, 8 штук, закупка 600, продажа 1400»</span></div>
<div class="muted" style="margin-top:10px">Голосовой ввод добавляет товар текущему поставщику. Артикул остаётся частью названия.</div>
</div>

<div class="card">
<div class="grid">
<div class="stat"><span class="muted">Поставщиков</span><b id="supCount">0</b></div>
<div class="stat"><span class="muted">Товаров, шт.</span><b id="qtyView">0</b></div>
<div class="stat"><span class="muted">Продажная сумма</span><b id="salesView">0 ₽</b></div>
</div>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('nakladnaya_v2')||'{"budget":0,"suppliers":[],"current":null}');
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0))+' ₽';
const save=()=>localStorage.setItem('nakladnaya_v2',JSON.stringify(data));
function render(){
 document.getElementById('budget').value=data.budget||'';
 document.getElementById('budgetView').textContent=money(data.budget);
 let spent=0,qty=0,sales=0;
 const root=document.getElementById('suppliers');root.innerHTML='';
 data.suppliers.forEach((s,si)=>{
  let st=0;
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="supplier"><div><div class="muted">Поставщик</div><h2>${esc(s.name)}</h2></div><div class="supplierTotal">Затраты: <span id="st${si}">0 ₽</span></div></div><div class="items"></div><div class="actions"><button class="ghost" onclick="addItem(${si})">+ Товар</button><button class="danger" onclick="removeSupplier(${si})">Удалить поставщика</button></div>`;
  const items=card.querySelector('.items');
  s.items.forEach((it,ii)=>{
   const sum=(+it.qty||0)*(+it.buy||0);st+=sum;qty+=+it.qty||0;sales+=(+it.qty||0)*(+it.sell||0);
   const div=document.createElement('div');div.className='item';
   div.innerHTML=`<div class="itemGrid">
   <img class="photo" src="${it.photo||''}" onerror="this.style.visibility='hidden'">
   <input value="${esc(it.name)}" onchange="edit(${si},${ii},'name',this.value)" placeholder="Название + артикул">
   <input value="${it.qty||''}" inputmode="decimal" onchange="edit(${si},${ii},'qty',this.value)" placeholder="Кол-во">
   <input value="${it.buy||''}" inputmode="decimal" onchange="edit(${si},${ii},'buy',this.value)" placeholder="Закупка">
   <input value="${it.sell||''}" inputmode="decimal" onchange="edit(${si},${ii},'sell',this.value)" placeholder="Продажа">
   <div class="sum">${money(sum)}</div></div>
   <div class="actions"><label style="display:inline-block"><button class="ghost" onclick="photo(${si},${ii})">📷 Фото</button><input id="ph${si}_${ii}" type="file" accept="image/*" style="display:none" onchange="setPhoto(${si},${ii},this.files[0])"></label><button class="danger" onclick="removeItem(${si},${ii})">Удалить</button></div>`;
   items.appendChild(div);
  });
  card.querySelector(`#st${si}`).textContent=money(st);root.appendChild(card);spent+=st;
 });
 document.getElementById('spentView').textContent=money(spent);
 document.getElementById('leftView').textContent=money((+data.budget||0)-spent);
 document.getElementById('supCount').textContent=data.suppliers.length;
 document.getElementById('qtyView').textContent=qty;
 document.getElementById('salesView').textContent=money(sales);
 save();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('budget').oninput=e=>{data.budget=+String(e.target.value).replace(',','.')||0;render()};
function addSupplier(){const n=document.getElementById('supplierName').value.trim();if(!n){alert('Введите название поставщика');return}data.suppliers.push({name:n,items:[]});data.current=data.suppliers.length-1;document.getElementById('supplierName').value='';render()}
function addItem(si, item={name:'',qty:'',buy:'',sell:'',photo:''}){data.suppliers[si].items.push(item);data.current=si;render()}
function edit(si,ii,k,v){data.suppliers[si].items[ii][k]=v;render()}
function removeItem(si,ii){data.suppliers[si].items.splice(ii,1);render()}
function removeSupplier(si){data.suppliers.splice(si,1);render()}
function photo(si,ii){document.getElementById(`ph${si}_${ii}`).click()}
function setPhoto(si,ii,file){if(!file)return;const r=new FileReader();r.onload=()=>{data.suppliers[si].items[ii].photo=r.result;render()};r.readAsDataURL(file)}
function parseVoice(t){
 t=t.replace(/ё/g,'е').trim();
 let qty=t.match(/(\d+(?:[,.]\d+)?)\s*(?:шт|штук|штуки)/i);
 let buy=t.match(/(?:закуп(?:ка|очная цена)?|закуп)\s*(?:цена)?\s*(\d+(?:[,.]\d+)?)/i);
 let sell=t.match(/(?:продаж(?:а|ная цена)?|продажа)\s*(?:цена)?\s*(\d+(?:[,.]\d+)?)/i);
 let nums=[...t.matchAll(/\b\d+(?:[,.]\d+)?\b/g)].map(x=>x[0]);
 if(!qty&&nums.length>=3) qty={1:nums[nums.length-3]};
 if(!buy&&nums.length>=2) buy={1:nums[nums.length-2]};
 if(!sell&&nums.length>=1) sell={1:nums[nums.length-1]};
 let cleaned=t.replace(/,?\s*(?:количество|кол-во|кол)\s*\d+(?:[,.]\d+)?/i,'').replace(/,?\s*\d+(?:[,.]\d+)?\s*(?:шт|штук|штуки)/i,'').replace(/,?\s*(?:закуп(?:ка|очная цена)?|закуп)\s*(?:цена)?\s*\d+(?:[,.]\d+)?/i,'').replace(/,?\s*(?:продаж(?:а|ная цена)?|продажа)\s*(?:цена)?\s*\d+(?:[,.]\d+)?/i,'').trim().replace(/[,.]$/,'');
 if(!cleaned) cleaned='Товар';
 return {name:cleaned,qty:qty?.[1]||'',buy:buy?.[1]||'',sell:sell?.[1]||''};
}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){document.getElementById('voiceStatus').textContent='В этом браузере голосовой ввод приложения недоступен. Откройте веб-версию в Safari и разрешите микрофон.';return}
 if(!data.suppliers.length){document.getElementById('voiceStatus').textContent='Сначала добавьте поставщика.';return}
 const r=new SR();r.lang='ru-RU';r.interimResults=false;r.continuous=false;
 document.getElementById('voiceStatus').textContent='Слушаю… говорите.';
 r.onresult=e=>{const text=e.results[0][0].transcript;const p=parseVoice(text);addItem(data.current??data.suppliers.length-1,p);document.getElementById('voiceStatus').textContent='Добавлено: '+text};
 r.onerror=e=>document.getElementById('voiceStatus').textContent='Не удалось распознать речь: '+e.error;
 r.onend=()=>{};
 r.start();
}
render();
</script>
</body>
</html>
